<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0a0a0a;
        color: #fafafa;
        font-family: 'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 0 80px;
        box-sizing: border-box;
      }
      .text {
        flex: 1;
        min-width: 0;
      }
      h1 {
        font-size: 88px;
        margin: 0 0 20px;
        letter-spacing: -2px;
      }
      p {
        margin: 8px 0;
        font-size: 29px;
        line-height: 1.35;
        color: #a3a3a3;
      }
      .tags {
        margin-top: 36px;
        display: flex;
        gap: 14px;
      }
      .tags span {
        border: 2px solid #404040;
        border-radius: 999px;
        padding: 8px 24px;
        font-size: 26px;
        color: #e5e5e5;
        font-family: Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <h1>NetworkStudy</h1>
      <p>Learn how network protocols work,<br />one packet at a time.</p>
      <p>ネットワークプロトコルの動きを、<br />1 パケットずつ自分の手で進めて学ぶ。</p>
      <div class="tags"><span>DNS</span><span>TCP</span><span>TLS 1.3</span></div>
    </div>
    <svg
      width="300"
      height="320"
      viewBox="0 0 300 320"
      fill="none"
      stroke="#737373"
      stroke-width="3"
    >
      <line x1="40" y1="10" x2="40" y2="310" stroke-dasharray="8 8" />
      <line x1="260" y1="10" x2="260" y2="310" stroke-dasharray="8 8" />
      <g stroke="#fafafa">
        <line x1="40" y1="90" x2="252" y2="90" />
        <path d="M260 90 l-14 -7 v14 z" fill="#fafafa" />
        <line x1="260" y1="170" x2="48" y2="170" />
        <path d="M40 170 l14 -7 v14 z" fill="#fafafa" />
        <line x1="40" y1="250" x2="252" y2="250" />
        <path d="M260 250 l-14 -7 v14 z" fill="#fafafa" />
      </g>
      <g
        fill="#fafafa"
        stroke="none"
        font-family="Menlo,monospace"
        font-size="22"
        text-anchor="middle"
      >
        <text x="150" y="76">SYN</text>
        <text x="150" y="156">SYN, ACK</text>
        <text x="150" y="236">ACK</text>
      </g>
    </svg>
  </body>
</html>
